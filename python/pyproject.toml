[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-python"
version = "1.0.0"
description = "SM2, SM3 and SM4 commercial cryptography algorithms with no third-party dependencies"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["smx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Long vectors are skipped unless SMX_SLOW_TESTS=1, under pytest and plain unittest alike.
markers = ["slow: long-running vectors, which also need SMX_SLOW_TESTS=1"]
