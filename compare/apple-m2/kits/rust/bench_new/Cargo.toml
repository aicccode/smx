[package]
name = "smx-bench-new"
version = "0.1.0"
edition = "2024"

[dependencies]
gm-rust = { path = "../new" }

[[bin]]
name = "smx-bench-new"
path = "../bench/main.rs"

# Identical on both sides: the default release profile, stated explicitly.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
panic = "unwind"

[workspace]
